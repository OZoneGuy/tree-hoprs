[package]
name = "tree-hoprs"
version = "0.2.0"
edition = "2021"
authors = ["Omar Alkersh <alkersh.omar@pm.me>"]

[lib]
name = "lib"
path = "lib/mod.rs"

[dependencies]
anyhow = "1.0.86"
async-trait = "0.1.89"
clap = { version = "4.5.16", features = ["derive"] }
comfy-table = { version = "7.1.1", features = ["custom_styling"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dialoguer = { version = "0.11.0", features = ["fuzzy-select", "completion"] }
futures = "0.3.32"
git2 = "0.20.4"
log = "0.4.29"
ratatui = "0.30.0"
rolling-file = "0.2.0"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"
simplelog = "0.12.2"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "process"] }
